<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pena">
  <!-- Token design-system: navy #1E3A5F, cream #F5F3EF, emas #C17F2E. -->
  <rect width="64" height="64" rx="14" fill="#1E3A5F"/>
  <!-- Georgia, bukan DM Serif Display: font web tidak dimuat saat browser
       merender favicon, jadi dipakai fallback serif yang sama dengan yang
       tertulis di token font-serif. -->
  <text x="32" y="43"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        fill="#F5F3EF">P</text>
  <rect x="20" y="49" width="24" height="3.5" rx="1.75" fill="#C17F2E"/>
</svg>
